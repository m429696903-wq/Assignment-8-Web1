<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e8eefc, #f7f7f7);
    }

    .calculator {
      width: 340px;
      background: #1f2937;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .display {
      width: 100%;
      min-height: 90px;
      background: #111827;
      color: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: right;
      font-size: 38px;
      overflow-x: auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 14px;
      font-size: 24px;
      cursor: pointer;
      background: #374151;
      color: white;
      transition: 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #4b5563;
    }

    .operator {
      background: #f59e0b;
    }

    .operator:hover {
      background: #d97706;
    }

    .control {
      background: #6b7280;
    }

    .equal {
      background: #10b981;
    }

    .equal:hover {
      background: #059669;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <div class="display" id="display">0</div>

    <div class="buttons">
      <button class="control" onclick="clearDisplay()">C</button>
      <button class="control" onclick="deleteLast()">⌫</button>
      <button class="control" onclick="percent()">%</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('*')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('-')">−</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendDot()">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let expression = "";

    function updateDisplay() {
      display.textContent = expression || "0";
    }

    function appendNumber(number) {
      expression += number;
      updateDisplay();
    }

    function appendDot() {
      const parts = expression.split(/[\+\-\*\/]/);
      const lastNumber = parts[parts.length - 1];

      if (!lastNumber.includes(".")) {
        expression += ".";
        updateDisplay();
      }
    }

    function appendOperator(operator) {
      if (expression === "") return;

      const lastChar = expression.slice(-1);

      if ("+-*/".includes(lastChar)) {
        expression = expression.slice(0, -1) + operator;
      } else {
        expression += operator;
      }

      updateDisplay();
    }

    function clearDisplay() {
      expression = "";
      updateDisplay();
    }

    function deleteLast() {
      expression = expression.slice(0, -1);
      updateDisplay();
    }

    function percent() {
      if (expression === "") return;

      try {
        expression = String(eval(expression) / 100);updateDisplay();
      } catch {
        display.textContent = "Error";
        expression = "";
      }
    }

    function calculate() {
      if (expression === "") return;

      try {
        const result = eval(expression);

        if (!isFinite(result)) {
          display.textContent = "Error";
          expression = "";
          return;
        }

        expression = String(Number(result.toFixed(10)));
        updateDisplay();
      } catch {
        display.textContent = "Error";
        expression = "";
      }
    }

    document.addEventListener("keydown", function (event) {
      const key = event.key;

      if (!isNaN(key)) appendNumber(key);
      else if (key === ".") appendDot();
      else if (["+", "-", "*", "/"].includes(key)) appendOperator(key);
      else if (key === "Enter" || key === "=") calculate();
      else if (key === "Escape") clearDisplay();
      else if (key === "Backspace") deleteLast();
      else if (key === "%") percent();
    });
  </script>
</body>
</html>
